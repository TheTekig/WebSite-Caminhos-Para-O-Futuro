<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador — {{ evento_nome }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div style="margin-bottom: 1.5rem;">
                <img src="/static/img/emblema-transp.png" alt="Logo" style="height: 40px; object-fit: contain;">
            </div>
            <h1>Área Administrativa</h1>
            <p>Entre com a senha de administrador para gerenciar o evento.</p>

            {% if erro %}
            <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); color: var(--error); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.875rem;">
                Senha incorreta. Tente novamente.
            </div>
            {% endif %}

            <form action="/admin/login" method="POST">
                <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
                    <label for="senha">Senha de Acesso</label>
                    <input type="password" id="senha" name="senha" required placeholder="Digite a senha" autofocus>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Entrar no Painel</button>
            </form>
            
            <div style="margin-top: 2rem;">
                <a href="/" style="color: var(--text-muted); font-size: 0.875rem; text-decoration: none;">← Voltar para o site</a>
            </div>
        </div>
    </div>
</body>
</html>
